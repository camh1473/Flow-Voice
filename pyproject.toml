[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowvoice"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
  "faster-whisper",
  "sounddevice",
  "numpy",
  "keyboard",
  "pyperclip",
  "pywin32",
  "PySide6",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "flowvoice._version.__version__"}

[tool.setuptools.package-data]
flowvoice = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["slow: loads a Whisper model"]
