[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowvoice"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper",
  "sounddevice",
  "numpy",
  "keyboard",
  "pyperclip",
  "pywin32",
  "pystray",
  "Pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["slow: loads a Whisper model"]
